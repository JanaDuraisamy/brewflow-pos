name: brewflow_pos
description: "BrewFlow POS - Offline First Multi Device Point of Sale System"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  google_fonts: ^6.3.1

  # -----------------------------
  # State Management
  # -----------------------------
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # -----------------------------
  # Navigation
  # -----------------------------
  go_router: ^16.2.1

  # -----------------------------
  # Local Database
  # -----------------------------
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1

  # -----------------------------
  # Media
  # -----------------------------
  image_picker: ^1.1.2
  share_plus: ^10.1.2

  # -----------------------------
  # Backend
  # -----------------------------
  supabase_flutter: ^2.10.1

  # -----------------------------
  # Secure Storage
  # -----------------------------
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # -----------------------------
  # Network
  # -----------------------------
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^2.7.2

  # -----------------------------
  # Utilities
  # -----------------------------
  intl: ^0.20.2
  logger: ^2.6.1
  uuid: ^4.5.1
  collection: ^1.19.1
  crypto: ^3.0.3

  # -----------------------------
  # Model / JSON
  # -----------------------------
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # -----------------------------
  # Environment Configuration
  # -----------------------------
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # -----------------------------
  # Code Generation
  # -----------------------------
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.11.0
  riverpod_generator: ^3.0.3
  drift_dev: ^2.28.2

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700